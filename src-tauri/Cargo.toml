[package]
name = "work-encourager"
version = "0.1.0"
description = "上班鼓励器 · 实时看到自己在赚钱"
authors = ["you"]
edition = "2021"

[lib]
name = "work_encourager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
